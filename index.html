<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Quiz Application</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="quiz">
  <h1>Programming Quiz</h1>

  <section id="start">
    <p>Test your Python and web basics. 8 questions, one at a time.</p>
    <button id="startBtn" class="btn">Start Quiz</button>
  </section>

  <section id="game" hidden>
    <div class="top"><span id="counter"></span><span id="score"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback" aria-live="polite"></p>
    <button id="nextBtn" class="btn" hidden>Next</button>
  </section>

  <section id="result" hidden>
    <h2>Quiz Complete!</h2>
    <p id="final"></p>
    <p id="message"></p>
    <ul id="review"></ul>
    <button id="restartBtn" class="btn">Try Again</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
